<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ウラガワ投稿ツール</title>
<style>
:root{--bg:#f6f8f4;--fg:#1f2a1f;--muted:#5d6b5c;--line:#dbe3d6;--accent:#3f8f3a}
@media (prefers-color-scheme:dark){:root{--bg:#141a14;--fg:#e6eee3;--muted:#9fb09c;--line:#2f3b2e;--accent:#7cc873}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8;padding:28px 16px}
.wrap{max-width:640px;margin:0 auto}h1{font-size:1.4rem}h2{font-size:1.05rem;margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:4px}a{color:var(--accent)}.muted{color:var(--muted);font-size:.9rem}
</style>
</head>
<body><div class="wrap">
<h1>ウラガワ投稿ツール</h1>
<p>YouTubeチャンネル「ウラガワずんだもん」の運営者が、自分のチャンネルの動画のタイトル・説明文・タグ・サムネイルを設定するために使う個人用ツールです。YouTube Data API を利用しています。</p>
<p>このツールは運営者本人のチャンネル以外では使われません。一般の方が登録・ログインすることはありません。</p>
<p><a href="privacy.html">プライバシーポリシー</a></p>
</div></body>
</html>
